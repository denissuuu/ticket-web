<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Tickets Restaurant</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <div class="container">
        <header class="animate__animated animate__fadeIn">
            <h1>Gestionnaire de Tickets Restaurant</h1>
            <div class="theme-selector">
                <label for="background-color">Couleur:</label>
                <input type="color" id="background-color" value="#f5f5f5">
                <button id="reset-color">Réinitialiser</button>
            </div>
        </header>
        
        <main>
            <div class="controls animate__animated animate__fadeInUp">
                <h2>Ajouter un nouveau ticket</h2>
                <div class="form-group">
                    <input type="text" id="ticket-issuer" placeholder="Nom du ticket">
                    <input type="number" id="ticket-value" placeholder="Valeur du ticket" min="0" step="0.01">
                    <input type="number" id="ticket-quantity" placeholder="Quantité" min="0">
                    <input type="date" id="ticket-date" placeholder="Date">
                    <button id="add-ticket">Ajouter</button>
                </div>
            </div>

            <div class="ticket-table-container animate__animated animate__fadeInUp">
                <h2>Mes tickets</h2>
                <table id="ticket-table">
                    <thead>
                        <tr>
                            <th>Nom du ticket</th>
                            <th>Valeur unitaire (€)</th>
                            <th>Quantité</th>
                            <th>Date</th>
                            <th>Valeur totale (€)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list">
                        
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4">Total</td>
                            <td id="total-value">0.00 €</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            
            <div id="details-container" class="hidden animate__animated animate__fadeIn">
                <h2>Détails des tickets <span id="details-title"></span></h2>
                <div id="details-content">
                    
                </div>
                <button id="close-details">Fermer</button>
            </div>
            
            <button id="reset-data" class="animate__animated animate__fadeIn">Réinitialiser toutes les données</button>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
